<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comanda de Produção</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #e5e5e5;
        font-family: "Courier New", Courier, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 16px 60px;
        min-height: 100vh;
      }

      .top-bar {
        width: 100%;
        max-width: 400px;
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .btn-print {
        flex: 1;
        background: #ff6b00;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 14px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn-print:hover {
        background: #e05c00;
      }

      .btn-close {
        background: #555;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 14px 18px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      .btn-close:hover {
        background: #333;
      }

      /* COMANDA — otimizada para impressora térmica 58mm */
      .cupom {
        width: 260px;
        background: #fff;
        padding: 10px 8px;
        font-size: 13px;
        line-height: 1.6;
        color: #000;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
        border-radius: 4px;
      }

      .cupom .logo {
        text-align: center;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 3px;
      }
      .cupom .subtitulo {
        text-align: center;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        background: #000;
        color: #fff;
        padding: 3px 4px;
        margin-bottom: 6px;
      }

      .cupom .sep {
        border: none;
        border-top: 1px dashed #000;
        margin: 6px 0;
      }
      .cupom .sep-solid {
        border: none;
        border-top: 2px solid #000;
        margin: 6px 0;
      }

      .cupom .row {
        display: flex;
        justify-content: space-between;
        gap: 4px;
      }
      .cupom .label {
        font-weight: 700;
      }
      .cupom .center {
        text-align: center;
      }
      .cupom .bold {
        font-weight: 900;
      }

      /* NÚMERO DO PEDIDO */
      .cupom .pedido-num {
        font-size: 28px;
        font-weight: 900;
        text-align: center;
        margin: 6px 0 3px;
        letter-spacing: 2px;
        border: 3px solid #000;
        padding: 4px 0;
      }

      /* ITENS */
      .cupom .itens-titulo {
        font-size: 14px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin: 6px 0 4px;
      }

      /* bloco do item */
      .cupom .item-bloco {
        margin-top: 8px;
        border: 2px solid #000;
        border-radius: 2px;
        overflow: hidden;
      }

      .cupom .item-nome {
        font-weight: 900;
        font-size: 14px;
        background: #000;
        color: #fff;
        padding: 4px 6px;
      }

      .cupom .item-detalhe {
        padding: 2px 8px;
        font-size: 12px;
        color: #000;
        font-weight: 700;
        border-bottom: 1px dashed #ccc;
      }
      .cupom .item-detalhe:last-child {
        border-bottom: none;
      }

      /* TAMANHO da pizza — destaque */
      .cupom .item-tamanho {
        padding: 3px 8px;
        font-size: 13px;
        font-weight: 900;
        background: #f0f0f0;
        border-bottom: 1px solid #ccc;
        letter-spacing: 0.5px;
      }

      /* METADE da pizza */
      .cupom .item-metade {
        padding: 3px 8px;
        font-size: 12px;
        font-weight: 900;
        border-bottom: 1px dashed #ccc;
      }

      /* EXTRAS / adicionais */
      .cupom .item-extra {
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 700;
        border-bottom: 1px dashed #ccc;
        color: #000;
      }

      /* OBSERVAÇÃO — destaque máximo para a cozinha */
      .cupom .item-obs {
        padding: 4px 8px;
        font-size: 13px;
        font-weight: 900;
        background: #000;
        color: #fff;
        border-top: 2px solid #000;
        letter-spacing: 0.3px;
      }

      /* TIPO DE ENTREGA */
      .cupom .entrega-box {
        border: 3px solid #000;
        padding: 6px 8px;
        margin: 8px 0 6px;
        font-weight: 900;
        font-size: 15px;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* ENDEREÇO (delivery) */
      .cupom .endereco-box {
        font-size: 12px;
        font-weight: 700;
        padding: 4px 6px;
        border: 1px dashed #000;
        margin-bottom: 6px;
        line-height: 1.4;
      }

      /* CLIENTE (rodapé) */
      .cupom .cliente-box {
        font-size: 12px;
        margin-top: 6px;
        padding-top: 4px;
        border-top: 1px dashed #000;
        color: #333;
        text-align: center;
      }

      /* ERRO */
      #error-box {
        background: #fff;
        border-radius: 12px;
        padding: 32px 24px;
        max-width: 360px;
        text-align: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      }
      #error-box h2 {
        color: #e53e3e;
        margin-bottom: 12px;
      }

      /* IMPRESSÃO — térmica 58mm */
      @media print {
        body {
          background: #fff;
          padding: 0;
          display: block;
        }
        .top-bar {
          display: none;
        }
        .cupom {
          width: 100%;
          box-shadow: none;
          border-radius: 0;
          font-size: 13px;
          padding: 4px 3px;
        }
        @page {
          size: 58mm auto;
          margin: 1mm 2mm;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      (function () {
        const app = document.getElementById("app");

        /* 1. Pegar dados da URL */
        const params = new URLSearchParams(window.location.search);
        const raw = params.get("d");

        if (!raw) {
          app.innerHTML = `<div id="error-box">
      <h2>⚠️ Link inválido</h2>
      <p>Este link não contém dados do pedido.<br>Solicite um novo link ao fazer o pedido.</p>
    </div>`;
          return;
        }

        let order;
        try {
          order = JSON.parse(decodeURIComponent(atob(raw)));
        } catch (e) {
          app.innerHTML = `<div id="error-box">
      <h2>⚠️ Erro ao ler pedido</h2>
      <p>Os dados do link estão corrompidos.</p>
    </div>`;
          return;
        }

        /* 2. Helpers */
        const sizeLabels = { P: "📏 PEQUENA", M: "📏 MÉDIA", G: "📏 GRANDE" };

        /* 3. Montar itens — todos os detalhes para a cozinha */
        let itensHTML = "";
        order.items.forEach((item) => {
          let blocoDetalhes = "";

          // Tamanho da pizza
          if (item.pizzaSize) {
            const tamLabel =
              sizeLabels[item.pizzaSize] || "📏 " + item.pizzaSize;
            blocoDetalhes += `<div class="item-tamanho">${tamLabel}</div>`;
          }

          // Metade (segundo sabor)
          if (item.secondFlavor && item.secondFlavor.trim()) {
            blocoDetalhes += `<div class="item-metade">🍕 METADE 2: ${item.secondFlavor}</div>`;
          }

          // Extras / adicionais
          if (item.extras && item.extras.length > 0) {
            item.extras.forEach((e) => {
              const el =
                typeof e === "object"
                  ? e.label || e.name || JSON.stringify(e)
                  : e;
              blocoDetalhes += `<div class="item-extra">➕ ${el}</div>`;
            });
          }

          // Observação — fundo preto para máximo destaque
          if (item.obs && item.obs.trim()) {
            blocoDetalhes += `<div class="item-obs">⚠️ OBS: ${item.obs.trim()}</div>`;
          }

          itensHTML += `
      <div class="item-bloco">
        <div class="item-nome">${item.quantity}× ${item.name}</div>
        ${blocoDetalhes}
      </div>`;
        });

        /* 4. Tipo de entrega */
        const orderLabels = {
          delivery: "🛵 DELIVERY",
          retirada: "🏪 RETIRADA",
        };
        const tipoEntrega =
          orderLabels[order.orderType] || (order.orderType || "").toUpperCase();

        /* 5. Endereço (apenas delivery) */
        const enderecoHTML =
          order.orderType === "delivery" && order.address
            ? `<div class="endereco-box">📍 ${order.address}</div>`
            : "";

        /* 6. Número do pedido */
        const numPedido = String(order.id || Date.now()).slice(-4);

        /* 7. Data/hora */
        let dataHora = "";
        try {
          dataHora = new Date(order.date).toLocaleString("pt-BR");
        } catch (e) {}

        /* 8. Comanda HTML */
        const cupomHTML = `
    <div class="cupom" id="cupom">
      <div class="logo">🍕 Pizzaria RA</div>
      <div class="subtitulo">— comanda de produção —</div>

      <div class="pedido-num">#${numPedido}</div>
      <div class="center" style="font-size:11px;margin-bottom:4px;">${dataHora}</div>

      <hr class="sep-solid">

      <div class="itens-titulo">📋 Itens a Preparar:</div>
      ${itensHTML}

      <hr class="sep">

      <div class="entrega-box">${tipoEntrega}</div>
      ${enderecoHTML}

      <div class="cliente-box">
        👤 ${order.customerName || "—"}<br>
        📱 ${order.customerPhone || "—"}
      </div>
    </div>`;

        /* 9. Renderizar */
        app.innerHTML = `
    <div class="top-bar">
      <button class="btn-print" onclick="window.print()">🖨️ Imprimir Comanda</button>
      <button class="btn-close" onclick="window.close()">✕ Fechar</button>
    </div>
    ${cupomHTML}`;

        /* 10. Auto print se veio com ?print=1 */
        if (params.get("print") === "1") {
          window.addEventListener("load", () =>
            setTimeout(() => window.print(), 600),
          );
        }
      })();
    </script>
  </body>
</html>
