<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comanda de Produção</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #e5e5e5;
        font-family: "Courier New", Courier, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 16px 60px;
        min-height: 100vh;
      }

      .top-bar {
        width: 100%;
        max-width: 400px;
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .btn-print {
        flex: 1;
        background: #ff6b00;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 14px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn-print:hover {
        background: #e05c00;
      }

      .btn-close {
        background: #555;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 14px 18px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      .btn-close:hover {
        background: #333;
      }

      /* ══════════════════════════════════════
         CUPOM — preview na tela
      ══════════════════════════════════════ */
      .cupom {
        width: 300px;
        background: #fff;
        padding: 10px 8px;
        font-size: 14px;
        line-height: 1.7;
        color: #000;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
        border-radius: 4px;
        font-family: "Courier New", Courier, monospace;
      }

      .cupom .logo {
        text-align: center;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 3px;
      }
      .cupom .subtitulo {
        text-align: center;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        background: #000;
        color: #fff;
        padding: 4px;
        margin-bottom: 6px;
      }

      .cupom .sep {
        border: none;
        border-top: 1px dashed #000;
        margin: 6px 0;
      }
      .cupom .sep-solid {
        border: none;
        border-top: 3px solid #000;
        margin: 6px 0;
      }
      .cupom .center {
        text-align: center;
      }

      /* NÚMERO DO PEDIDO */
      .cupom .pedido-num {
        font-size: 36px;
        font-weight: 900;
        text-align: center;
        margin: 6px 0 3px;
        letter-spacing: 4px;
        border: 3px solid #000;
        padding: 6px 0;
      }

      /* ITENS */
      .cupom .itens-titulo {
        font-size: 15px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin: 6px 0 4px;
      }

      .cupom .item-bloco {
        border: 2px solid #000;
        border-radius: 2px;
        margin-top: 8px;
        overflow: hidden;
      }

      .cupom .item-nome {
        font-weight: 900;
        font-size: 16px;
        background: #000;
        color: #fff;
        padding: 5px 8px;
        line-height: 1.4;
      }

      .cupom .item-tamanho {
        font-weight: 900;
        font-size: 14px;
        background: #e8e8e8;
        padding: 4px 8px;
        border-bottom: 1px solid #ccc;
        text-transform: uppercase;
      }

      .cupom .item-metade {
        font-weight: 900;
        font-size: 14px;
        padding: 4px 8px;
        border-bottom: 1px dashed #aaa;
      }

      .cupom .item-extra {
        font-weight: 700;
        font-size: 13px;
        padding: 3px 8px;
        border-bottom: 1px dashed #ccc;
      }

      .cupom .item-obs {
        font-weight: 900;
        font-size: 14px;
        padding: 5px 8px;
        background: #000;
        color: #fff;
      }

      /* TIPO DE ENTREGA */
      .cupom .entrega-box {
        border: 3px solid #000;
        padding: 7px 8px;
        margin: 8px 0 4px;
        font-weight: 900;
        font-size: 17px;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* PAGAMENTO */
      .cupom .pag-box {
        border: 2px solid #000;
        border-radius: 2px;
        margin: 6px 0 4px;
        overflow: hidden;
      }
      .cupom .pag-label {
        background: #555;
        color: #fff;
        font-weight: 900;
        font-size: 11px;
        padding: 3px 8px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .cupom .pag-valor {
        font-weight: 900;
        font-size: 16px;
        padding: 5px 8px;
        text-transform: uppercase;
      }
      .cupom .pag-troco {
        font-weight: 700;
        font-size: 13px;
        padding: 3px 8px 5px;
        color: #333;
        border-top: 1px dashed #ccc;
      }

      .cupom .endereco-box {
        font-size: 13px;
        font-weight: 700;
        padding: 5px 6px;
        border: 1px dashed #000;
        margin-bottom: 6px;
        line-height: 1.5;
      }

      .cupom .cliente-box {
        font-size: 13px;
        font-weight: 700;
        margin-top: 6px;
        padding-top: 4px;
        border-top: 1px dashed #000;
        color: #000;
        text-align: center;
        line-height: 1.8;
      }

      /* ERRO */
      #error-box {
        background: #fff;
        border-radius: 12px;
        padding: 32px 24px;
        max-width: 360px;
        text-align: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      }
      #error-box h2 {
        color: #e53e3e;
        margin-bottom: 12px;
      }

      /* ══════════════════════════════════════
         IMPRESSÃO TÉRMICA 58mm — MPT-II
         
         Estratégia:
         - @page: 58mm de largura, altura automática
         - font-size base 16px (≈ 12pt) — legível na térmica
         - font-weight: 900 em todo o documento
         - -webkit-print-color-adjust para manter fundos pretos
         - sem margens laterais excessivas
      ══════════════════════════════════════ */
      @media print {
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          color-adjust: exact !important;
        }

        html,
        body {
          background: #fff !important;
          margin: 0 !important;
          padding: 0 !important;
          width: 58mm !important;
        }

        .top-bar {
          display: none !important;
        }

        .cupom {
          width: 54mm !important; /* 58mm - 2mm de cada lado */
          max-width: 54mm !important;
          margin: 0 auto !important;
          padding: 2mm 1mm !important;
          box-shadow: none !important;
          border-radius: 0 !important;
          font-size: 16px !important; /* BASE: bem legível na térmica */
          font-weight: 900 !important;
          line-height: 1.6 !important;
        }

        /* Forçar negrito em todos os elementos */
        .cupom * {
          font-weight: 900 !important;
        }

        .cupom .logo {
          font-size: 20px !important;
          margin-bottom: 2mm !important;
        }

        .cupom .subtitulo {
          font-size: 14px !important;
          padding: 3px 2px !important;
          margin-bottom: 3mm !important;
          background: #000 !important;
          color: #fff !important;
        }

        .cupom .pedido-num {
          font-size: 38px !important; /* GRANDE — número do pedido é o mais importante */
          border: 3px solid #000 !important;
          padding: 3mm 0 !important;
          margin: 2mm 0 !important;
          letter-spacing: 3px !important;
        }

        .cupom .itens-titulo {
          font-size: 16px !important;
          margin: 2mm 0 1mm !important;
        }

        .cupom .item-bloco {
          border: 2px solid #000 !important;
          margin-top: 2mm !important;
          page-break-inside: avoid !important;
        }

        .cupom .item-nome {
          font-size: 17px !important; /* Nome do item bem grande */
          padding: 2mm 2mm !important;
          background: #000 !important;
          color: #fff !important;
          line-height: 1.3 !important;
        }

        .cupom .item-tamanho {
          font-size: 15px !important;
          padding: 1.5mm 2mm !important;
          background: #ddd !important;
        }

        .cupom .item-metade {
          font-size: 15px !important;
          padding: 1.5mm 2mm !important;
        }

        .cupom .item-extra {
          font-size: 14px !important;
          padding: 1mm 2mm !important;
        }

        .cupom .item-obs {
          font-size: 16px !important; /* Observação bem visível */
          padding: 2mm 2mm !important;
          background: #000 !important;
          color: #fff !important;
        }

        .cupom .entrega-box {
          font-size: 18px !important; /* Tipo de entrega bem grande */
          border: 3px solid #000 !important;
          padding: 2mm !important;
          margin: 2mm 0 !important;
        }

        .cupom .pag-box {
          border: 2px solid #000 !important;
          margin: 2mm 0 !important;
          page-break-inside: avoid !important;
        }
        .cupom .pag-label {
          font-size: 11px !important;
          padding: 2px 2mm !important;
          background: #555 !important;
          color: #fff !important;
        }
        .cupom .pag-valor {
          font-size: 16px !important;
          padding: 2mm !important;
        }
        .cupom .pag-troco {
          font-size: 13px !important;
          padding: 1mm 2mm 2mm !important;
        }

        .cupom .endereco-box {
          font-size: 14px !important;
          padding: 1.5mm !important;
          line-height: 1.5 !important;
        }

        .cupom .cliente-box {
          font-size: 14px !important;
          padding-top: 2mm !important;
          margin-top: 2mm !important;
          line-height: 1.7 !important;
        }

        .cupom .sep {
          margin: 2mm 0 !important;
        }
        .cupom .sep-solid {
          border-top-width: 2px !important;
          margin: 2mm 0 !important;
        }

        @page {
          size: 58mm auto;
          margin: 0mm 2mm;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      (function () {
        const app = document.getElementById("app");

        /* 1. Pegar dados da URL */
        const params = new URLSearchParams(window.location.search);
        const raw = params.get("d");

        if (!raw) {
          app.innerHTML = `<div id="error-box">
      <h2>⚠️ Link inválido</h2>
      <p>Este link não contém dados do pedido.<br>Solicite um novo link ao fazer o pedido.</p>
    </div>`;
          return;
        }

        let order;
        try {
          order = JSON.parse(decodeURIComponent(atob(raw)));
        } catch (e) {
          app.innerHTML = `<div id="error-box">
      <h2>⚠️ Erro ao ler pedido</h2>
      <p>Os dados do link estão corrompidos.</p>
    </div>`;
          return;
        }

        /* 2. Helpers */
        const sizeLabels = { P: "PEQUENA", M: "MÉDIA", G: "GRANDE" };

        /* 3. Montar itens */
        let itensHTML = "";

        order.items.forEach((item) => {
          let detalhes = "";

          if (item.pizzaSize && item.pizzaSize.trim()) {
            const tam = sizeLabels[item.pizzaSize] || item.pizzaSize;
            detalhes += `<div class="item-tamanho">TAMANHO: ${tam}</div>`;
          }

          if (item.secondFlavor && item.secondFlavor.trim()) {
            detalhes += `<div class="item-metade">METADE 2: ${item.secondFlavor}</div>`;
          }

          if (item.extras && item.extras.length > 0) {
            item.extras.forEach((e) => {
              const label =
                typeof e === "object" ? e.label || e.name || "" : String(e);
              if (label.trim()) {
                detalhes += `<div class="item-extra">+ ${label}</div>`;
              }
            });
          }

          if (item.obs && item.obs.trim()) {
            detalhes += `<div class="item-obs">OBS: ${item.obs.trim().toUpperCase()}</div>`;
          }

          itensHTML += `
      <div class="item-bloco">
        <div class="item-nome">${item.quantity}x ${item.name}</div>
        ${detalhes}
      </div>`;
        });

        /* TIPO DE ENTREGA */
        const orderLabels = {
          delivery: "DELIVERY",
          retirada: "RETIRADA NA LOJA",
        };
        const tipoEntrega =
          orderLabels[order.orderType] || (order.orderType || "").toUpperCase();

        /* 5. Pagamento */
        const payLabels = {
          pix: "💠 PIX",
          cartao: "💳 CARTÃO",
          dinheiro: "💵 DINHEIRO",
        };
        const pagLabel =
          payLabels[order.paymentType] ||
          (order.paymentType || "").toUpperCase();
        const totalPedido = parseFloat(order.total) || 0;
        const totalFormatado = totalPedido.toFixed(2).replace(".", ",");

        let trocoHTML = "";
        if (order.paymentType === "dinheiro") {
          const valorPago = parseFloat(order.troco) || 0;
          if (valorPago > 0) {
            const trocoDevolver = Math.max(0, valorPago - totalPedido)
              .toFixed(2)
              .replace(".", ",");
            const trocoPara = valorPago.toFixed(2).replace(".", ",");
            trocoHTML = `<div class="pag-troco">Paga com: R$&nbsp;${trocoPara}<br>Troco a devolver: R$&nbsp;${trocoDevolver}</div>`;
          }
        }
        const pagamentoHTML = `
          <div class="pag-box">
            <div class="pag-label">PAGAMENTO</div>
            <div class="pag-valor">${pagLabel}</div>
            <div class="pag-troco">Valor total: R$&nbsp;${totalFormatado}</div>
            ${trocoHTML}
          </div>`;

        /* 5. Endereço */
        const enderecoHTML =
          order.orderType === "delivery" && order.address
            ? `<div class="endereco-box">ENDERECO: ${order.address}</div>`
            : "";

        /* 6. Número do pedido */
        const numPedido = String(order.id || Date.now())
          .slice(-4)
          .toUpperCase();

        /* 7. Data/hora */
        let dataHora = "";
        try {
          dataHora = new Date(order.date).toLocaleString("pt-BR");
        } catch (_) {}

        /* 9. Renderizar */
        app.innerHTML = `
    <div class="top-bar">
      <button class="btn-print" onclick="window.print()">🖨️ Imprimir Comanda</button>
      <button class="btn-close" onclick="window.close()">✕ Fechar</button>
    </div>
    <div class="cupom" id="cupom">
      <div class="logo">PIZZARIA RA</div>
      <div class="subtitulo">COMANDA DE PRODUCAO</div>

      <div class="pedido-num">#${numPedido}</div>
      <div class="center" style="font-size:12px;margin-bottom:4px;font-weight:700;">${dataHora}</div>

      <hr class="sep-solid">

      <div class="itens-titulo">ITENS A PREPARAR:</div>
      ${itensHTML}

      <hr class="sep">

      <div class="entrega-box">${tipoEntrega}</div>
      ${enderecoHTML}

      ${pagamentoHTML}

      <div class="cliente-box">
        CLIENTE: ${order.customerName || "---"}<br>
        FONE: ${order.customerPhone || "---"}
      </div>
    </div>`;

        /* 10. Auto-print */
        if (params.get("print") === "1") {
          window.addEventListener("load", () =>
            setTimeout(() => window.print(), 600),
          );
        }
      })();
    </script>
  </body>
</html>
