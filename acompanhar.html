<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acompanhar Pedido — Pizzaria do Rael</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --red: #c8102e;
        --red-dk: #a00d24;
        --red-lt: rgba(200, 16, 46, 0.12);
        --yellow: #f5a623;
        --yellow-lt: rgba(245, 166, 35, 0.13);
        --black: #111111;
        --dark: #1c1c1c;
        --card: #222222;
        --card2: #2c2c2c;
        --border: rgba(255, 255, 255, 0.08);
        --text: #f0f0f0;
        --muted: #999;
        --green: #22c55e;
        --blue: #3b82f6;
        --purple: #a855f7;
      }

      body {
        background: var(--black);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 0 60px;
      }

      /* ── HEADER ── */
      header {
        width: 100%;
        background: linear-gradient(135deg, var(--red-dk) 0%, #1a0007 100%);
        padding: 22px 16px 28px;
        text-align: center;
        border-bottom: 3px solid var(--red);
        margin-bottom: 24px;
        position: relative;
        overflow: hidden;
      }
      header::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          -45deg,
          transparent,
          transparent 18px,
          rgba(255, 255, 255, 0.025) 18px,
          rgba(255, 255, 255, 0.025) 20px
        );
        pointer-events: none;
      }
      header .logo {
        font-size: 1.75rem;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        position: relative;
      }
      header .logo .ra {
        color: var(--yellow);
        text-shadow: 0 0 20px rgba(245, 166, 35, 0.5);
      }
      header .sub {
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.6);
        margin-top: 5px;
        text-transform: uppercase;
        letter-spacing: 2px;
        position: relative;
      }

      /* ── CARD ── */
      .card {
        background: var(--card);
        border-radius: 18px;
        padding: 22px 18px;
        width: 100%;
        max-width: 460px;
        margin: 0 16px 16px;
        border: 1px solid var(--border);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      }

      /* ── NÚMERO DO PEDIDO ── */
      .pedido-num {
        text-align: center;
        margin-bottom: 18px;
      }
      .pedido-num .label {
        font-size: 0.72rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      .pedido-num .num {
        font-size: 3rem;
        font-weight: 900;
        color: var(--yellow);
        line-height: 1;
        margin: 4px 0;
        text-shadow: 0 0 24px rgba(245, 166, 35, 0.35);
      }
      .pedido-num .data {
        font-size: 0.78rem;
        color: var(--muted);
      }

      /* ── STATUS ATUAL ── */
      .status-atual {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 14px 20px;
        border-radius: 14px;
        font-size: 1.05rem;
        font-weight: 800;
        margin-bottom: 26px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border: 2px solid currentColor;
        animation: pulso 2s infinite;
      }
      .status-atual .emoji {
        font-size: 1.4rem;
      }
      @keyframes pulso {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.8;
        }
      }

      /* ── STEPPER ── */
      .stepper {
        display: flex;
        flex-direction: column;
        gap: 0;
        margin-bottom: 20px;
      }

      .step {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 10px 0;
        opacity: 0.3;
        transition: opacity 0.4s;
      }
      .step.done {
        opacity: 1;
      }
      .step.active {
        opacity: 1;
      }
      .step.cancelled {
        opacity: 1;
      }

      .step-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #333;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        flex-shrink: 0;
        position: relative;
        z-index: 1;
        transition:
          background 0.4s,
          box-shadow 0.4s;
      }
      .step.done .step-icon {
        background: var(--green);
      }
      .step.active .step-icon {
        background: var(--red);
        box-shadow: 0 0 0 4px rgba(200, 16, 46, 0.3);
      }
      .step.cancelled .step-icon {
        background: #555;
      }

      .step-connector {
        width: 2px;
        height: 22px;
        background: #333;
        margin-left: 19px;
        transition: background 0.4s;
      }
      .step-connector.done {
        background: var(--green);
      }

      .step-info {
        padding-top: 8px;
      }
      .step-info .step-title {
        font-weight: 700;
        font-size: 0.95rem;
      }
      .step-info .step-desc {
        font-size: 0.78rem;
        color: var(--muted);
        margin-top: 2px;
      }

      /* ── RESUMO DO PEDIDO ── */
      .resumo-titulo {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--muted);
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }

      .item-linha {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
        padding: 9px 0;
        border-bottom: 1px solid var(--border);
        font-size: 0.88rem;
      }
      .item-linha:last-child {
        border-bottom: none;
      }

      .item-qtd {
        background: var(--red);
        color: #fff;
        font-weight: 900;
        font-size: 0.72rem;
        padding: 2px 7px;
        border-radius: 20px;
        flex-shrink: 0;
      }
      .item-detalhes {
        flex: 1;
      }
      .item-nome {
        font-weight: 700;
      }
      .item-extra {
        font-size: 0.76rem;
        color: var(--yellow);
        margin-top: 2px;
      }
      .item-obs {
        font-size: 0.76rem;
        color: #f87171;
        margin-top: 2px;
        font-weight: 700;
      }
      .item-preco {
        font-weight: 700;
        color: var(--yellow);
        flex-shrink: 0;
      }

      .total-linha {
        display: flex;
        justify-content: space-between;
        padding: 12px 0 0;
        font-weight: 900;
        font-size: 1.05rem;
        border-top: 2px solid var(--border);
        margin-top: 4px;
      }
      .total-linha span:last-child {
        color: var(--yellow);
      }

      /* ── INFO ── */
      .info-grid {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .info-row {
        display: flex;
        gap: 10px;
        font-size: 0.87rem;
      }
      .info-label {
        color: var(--muted);
        min-width: 84px;
        font-weight: 600;
      }
      .info-val {
        font-weight: 700;
      }

      /* ── LOADER ── */
      .loader {
        text-align: center;
        padding: 60px 20px;
        color: var(--muted);
      }
      .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #333;
        border-top-color: var(--red);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── ERRO ── */
      .erro-box {
        text-align: center;
        padding: 40px 20px;
        color: var(--muted);
      }
      .erro-box .emoji {
        font-size: 3rem;
        display: block;
        margin-bottom: 12px;
      }
      .erro-box h2 {
        color: var(--red);
        margin-bottom: 8px;
      }

      /* ── BADGE AO VIVO ── */
      .ao-vivo {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(34, 197, 94, 0.1);
        color: var(--green);
        font-size: 0.72rem;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 20px;
        margin-bottom: 18px;
        border: 1px solid rgba(34, 197, 94, 0.25);
      }
      .ao-vivo .dot {
        width: 7px;
        height: 7px;
        background: var(--green);
        border-radius: 50%;
        animation: blink 1.2s infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
      }

      /* ── DIVISOR ── */
      .divider {
        width: 40px;
        height: 3px;
        background: var(--red);
        border-radius: 2px;
        margin: 0 auto 16px;
      }

      /* ── TEMPO DE ENTREGA ── */
      .tempo-box {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(245, 166, 35, 0.1);
        border: 1.5px solid rgba(245, 166, 35, 0.35);
        border-radius: 12px;
        padding: 12px 16px;
        margin-bottom: 16px;
        font-size: 0.92rem;
        font-weight: 700;
        color: var(--yellow);
      }
      .tempo-box .tempo-emoji {
        font-size: 1.3rem;
        flex-shrink: 0;
      }
      .tempo-box .tempo-label {
        font-size: 0.7rem;
        font-weight: 600;
        color: rgba(245, 166, 35, 0.65);
        text-transform: uppercase;
        letter-spacing: 1px;
        display: block;
        margin-bottom: 2px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">🍕 Pizzaria do <span class="ra">Rael</span></div>
      <div class="sub">Acompanhamento de Pedido</div>
    </header>

    <div id="app">
      <div class="card">
        <div class="loader">
          <div class="spinner"></div>
          <div>Buscando seu pedido...</div>
        </div>
      </div>
    </div>

    <script type="module">
      import {
        initializeApp,
        getApps,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getFirestore,
        doc,
        onSnapshot,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBm9XjET1VETadadyq9MOSij1f4ND_4SI4",
        authDomain: "pizzaria-rael.firebaseapp.com",
        projectId: "pizzaria-rael",
        storageBucket: "pizzaria-rael.firebasestorage.app",
        messagingSenderId: "737517289116",
        appId: "1:737517289116:web:1a49ac56da1b21e25b3759",
      };

      const app = getApps().length
        ? getApps()[0]
        : initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const appEl = document.getElementById("app");

      /* helpers */
      function fmtDate(ts) {
        if (!ts) return "";
        const d = ts.toDate ? ts.toDate() : new Date(ts);
        return d.toLocaleString("pt-BR");
      }
      function fmtMoeda(v) {
        return (
          "R$ " +
          Number(v || 0)
            .toFixed(2)
            .replace(".", ",")
        );
      }

      /* status config */
      const STATUS_CFG = {
        Pendente: {
          cor: "#f5a623",
          bg: "rgba(245,166,35,.12)",
          emoji: "⏳",
          label: "Aguardando confirmação",
        },
        Preparando: {
          cor: "#3b82f6",
          bg: "rgba(59,130,246,.12)",
          emoji: "👨‍🍳",
          label: "Na cozinha agora!",
        },
        "Saiu para entrega": {
          cor: "#a855f7",
          bg: "rgba(168,85,247,.12)",
          emoji: "🛵",
          label: "A caminho de você!",
        },
        Entregue: {
          cor: "#22c55e",
          bg: "rgba(34,197,94,.12)",
          emoji: "✅",
          label: "Entregue com sucesso!",
        },
        Cancelado: {
          cor: "#ef4444",
          bg: "rgba(239,68,68,.12)",
          emoji: "❌",
          label: "Pedido cancelado",
        },
      };

      const STEPS = [
        {
          key: "Pendente",
          emoji: "📝",
          title: "Pedido recebido",
          desc: "Sua mensagem chegou!",
        },
        {
          key: "Preparando",
          emoji: "👨‍🍳",
          title: "Em preparação",
          desc: "A cozinha está caprichando!",
        },
        {
          key: "Saiu para entrega",
          emoji: "🛵",
          title: "Saiu para entrega",
          desc: "Já está a caminho!",
        },
        {
          key: "Entregue",
          emoji: "✅",
          title: "Entregue",
          desc: "Bom apetite! 🍕",
        },
      ];

      function stepIndex(s) {
        return STEPS.findIndex((x) => x.key === s);
      }

      /* render */
      function renderPage(data, id) {
        const status = data.status || "Pendente";
        const cfg = STATUS_CFG[status] || STATUS_CFG["Pendente"];
        const isCancelado = status === "Cancelado";
        const curIdx = stepIndex(status);
        const numPedido = "#" + String(id).slice(-4).toUpperCase();
        const agora = new Date().toLocaleTimeString("pt-BR");

        /* itens */
        const itens = data.itens || data.items || data.cartSnapshot || [];
        const tamLabels = { P: "Pequena", M: "Média", G: "Grande" };
        let itensHTML = "";
        itens.forEach((item) => {
          const nome = item.name || item.nome || "—";
          const qtd = item.quantity || item.quantidade || 1;
          const preco = item.price || item.preco || 0;
          const extras = item.extras || [];
          const obs = (item.obs || "").trim();
          const metade = item.secondFlavor || item.metade || "";
          const tamanho = item.pizzaSize || item.tamanho || "";

          let det = `<div class="item-nome">${nome}</div>`;
          if (tamanho)
            det += `<div class="item-extra">📏 ${tamLabels[tamanho] || tamanho}</div>`;
          if (metade)
            det += `<div class="item-extra">🍕 Metade: ${metade}</div>`;
          extras.forEach((e) => {
            det += `<div class="item-extra">➕ ${typeof e === "object" ? e.label : e}</div>`;
          });
          if (obs) det += `<div class="item-obs">⚠️ ${obs}</div>`;

          const subtotal = (preco + (item.extrasTotal || 0)) * qtd;
          itensHTML += `
      <div class="item-linha">
        <span class="item-qtd">${qtd}×</span>
        <div class="item-detalhes">${det}</div>
        <span class="item-preco">${fmtMoeda(subtotal)}</span>
      </div>`;
        });

        /* stepper */
        let stepperHTML = "";
        if (isCancelado) {
          stepperHTML = `
      <div class="step cancelled">
        <div class="step-icon">❌</div>
        <div class="step-info">
          <div class="step-title">Pedido Cancelado</div>
          <div class="step-desc">Entre em contato conosco.</div>
        </div>
      </div>`;
        } else {
          STEPS.forEach((step, idx) => {
            const isDone = idx < curIdx;
            const isActive = idx === curIdx;
            const cls = isDone ? "done" : isActive ? "active" : "";
            stepperHTML += `
        ${idx > 0 ? `<div class="step-connector ${isDone ? "done" : ""}"></div>` : ""}
        <div class="step ${cls}">
          <div class="step-icon">${step.emoji}</div>
          <div class="step-info">
            <div class="step-title">${step.title}</div>
            <div class="step-desc">${step.desc}</div>
          </div>
        </div>`;
          });
        }

        /* info */
        const tipoLabel =
          data.tipoPedido === "delivery" ? "🛵 Delivery" : "🏪 Retirada";
        const pagLabels = {
          pix: "PIX",
          cartao: "Cartão",
          dinheiro: "Dinheiro",
        };
        const pagLabel =
          pagLabels[data.pagamento] || (data.pagamento || "").toUpperCase();
        const endRow =
          data.tipoPedido === "delivery" && data.endereco
            ? `<div class="info-row"><span class="info-label">📍 Endereço</span><span class="info-val">${data.endereco}</span></div>`
            : "";

        /* tempo de entrega estimado */
        let tempoHTML = "";
        if (
          data.tempoEntrega &&
          status !== "Entregue" &&
          status !== "Cancelado"
        ) {
          tempoHTML = `
            <div class="tempo-box">
              <span class="tempo-emoji">⏱️</span>
              <div>
                <span class="tempo-label">Tempo estimado de entrega</span>
                ${data.tempoEntrega}
              </div>
            </div>`;
        }

        appEl.innerHTML = `
    <div class="card">
      <div class="ao-vivo"><span class="dot"></span> Ao vivo · ${agora}</div>

      <div class="pedido-num">
        <div class="label">Seu Pedido</div>
        <div class="num">${numPedido}</div>
        <div class="data">${fmtDate(data.dataPedido)}</div>
      </div>

      <div class="divider"></div>

      <div class="status-atual" style="background:${cfg.bg}; color:${cfg.cor}; border-color:${cfg.cor}40;">
        <span class="emoji">${cfg.emoji}</span>
        <span>${cfg.label}</span>
      </div>

      ${tempoHTML}

      <div class="stepper">${stepperHTML}</div>
    </div>

    <div class="card">
      <div class="resumo-titulo">📋 Resumo do Pedido</div>
      ${itensHTML}
      <div class="total-linha">
        <span>Total</span>
        <span>${fmtMoeda(data.total)}</span>
      </div>
    </div>

    <div class="card">
      <div class="resumo-titulo">ℹ️ Informações</div>
      <div class="info-grid">
        <div class="info-row">
          <span class="info-label">👤 Cliente</span>
          <span class="info-val">${data.clienteNome || "—"}</span>
        </div>
        <div class="info-row">
          <span class="info-label">📱 Telefone</span>
          <span class="info-val">${data.telefone || "—"}</span>
        </div>
        <div class="info-row">
          <span class="info-label">🚀 Entrega</span>
          <span class="info-val">${tipoLabel}</span>
        </div>
        ${endRow}
        <div class="info-row">
          <span class="info-label">💳 Pagamento</span>
          <span class="info-val">${pagLabel}</span>
        </div>
      </div>
    </div>`;
      }

      /* listener com reconexão */
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get("id");

      if (!orderId) {
        appEl.innerHTML = `<div class="card erro-box">
    <span class="emoji">😕</span>
    <h2>Link inválido</h2>
    <p>Este link não contém um ID de pedido válido.</p>
  </div>`;
      } else {
        let unsubscribe = null;

        function startListener() {
          if (unsubscribe) {
            unsubscribe();
            unsubscribe = null;
          }
          unsubscribe = onSnapshot(
            doc(db, "pedidos", orderId),
            { includeMetadataChanges: false },
            (snap) => {
              if (!snap.exists()) {
                appEl.innerHTML = `<div class="card erro-box">
            <span class="emoji">🔍</span>
            <h2>Pedido não encontrado</h2>
            <p>Verifique se o link está correto.</p>
          </div>`;
              } else {
                renderPage(snap.data(), snap.id);
              }
            },
            (err) => {
              console.error("[acompanhar] Erro:", err);
              setTimeout(startListener, 5000);
              appEl.innerHTML = `<div class="card erro-box">
          <span class="emoji">⚠️</span>
          <h2>Erro de conexão</h2>
          <p>Reconectando em 5 segundos...</p>
        </div>`;
            },
          );
        }

        startListener();

        // Reconectar ao voltar para a aba
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") startListener();
        });
      }
    </script>
  </body>
</html>
