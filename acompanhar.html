<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acompanhar Pedido — Pizzaria RA</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --laranja: #ff6b00;
        --laranja-dark: #e05c00;
        --bg: #1a1a2e;
        --card: #16213e;
        --card2: #0f3460;
        --text: #eee;
        --muted: #aaa;
        --green: #10b981;
        --yellow: #f59e0b;
        --blue: #3b82f6;
        --purple: #8b5cf6;
        --red: #ef4444;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 0 60px;
      }

      /* HEADER */
      header {
        width: 100%;
        background: linear-gradient(135deg, #0f3460, #16213e);
        padding: 20px 16px 24px;
        text-align: center;
        border-bottom: 3px solid var(--laranja);
        margin-bottom: 28px;
      }
      header .logo {
        font-size: 1.6rem;
        font-weight: 900;
        letter-spacing: 1px;
      }
      header .logo span {
        color: var(--laranja);
      }
      header .sub {
        font-size: 0.85rem;
        color: var(--muted);
        margin-top: 4px;
      }

      /* CARD PRINCIPAL */
      .card {
        background: var(--card);
        border-radius: 20px;
        padding: 24px 20px;
        width: 100%;
        max-width: 460px;
        margin: 0 16px 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }

      /* NÚMERO DO PEDIDO */
      .pedido-num {
        text-align: center;
        margin-bottom: 20px;
      }
      .pedido-num .label {
        font-size: 0.8rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .pedido-num .num {
        font-size: 3rem;
        font-weight: 900;
        color: var(--laranja);
        line-height: 1;
        margin: 4px 0;
      }
      .pedido-num .data {
        font-size: 0.8rem;
        color: var(--muted);
      }

      /* STATUS ATUAL — destaque */
      .status-atual {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 14px 20px;
        border-radius: 14px;
        font-size: 1.1rem;
        font-weight: 800;
        margin-bottom: 28px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        animation: pulso 2s infinite;
      }
      .status-atual .emoji {
        font-size: 1.5rem;
      }
      @keyframes pulso {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.85;
        }
      }

      /* STEPPER */
      .stepper {
        display: flex;
        flex-direction: column;
        gap: 0;
        margin-bottom: 24px;
      }

      .step {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 10px 0;
        opacity: 0.35;
        transition: opacity 0.4s;
      }
      .step.done {
        opacity: 1;
      }
      .step.active {
        opacity: 1;
      }
      .step.cancelled {
        opacity: 1;
      }

      .step-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #333;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        flex-shrink: 0;
        position: relative;
        z-index: 1;
        transition: background 0.4s;
      }
      .step.done .step-icon {
        background: var(--green);
      }
      .step.active .step-icon {
        background: var(--laranja);
        box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.25);
      }
      .step.cancelled .step-icon {
        background: var(--red);
      }

      /* linha conectora */
      .step-connector {
        width: 2px;
        height: 24px;
        background: #333;
        margin-left: 19px;
        transition: background 0.4s;
      }
      .step-connector.done {
        background: var(--green);
      }

      .step-info {
        padding-top: 8px;
      }
      .step-info .step-title {
        font-weight: 700;
        font-size: 0.95rem;
      }
      .step-info .step-desc {
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 2px;
      }

      /* RESUMO DO PEDIDO */
      .resumo-titulo {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--muted);
        margin-bottom: 12px;
        padding-bottom: 6px;
        border-bottom: 1px solid #2a2a4a;
      }

      .item-linha {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
        padding: 8px 0;
        border-bottom: 1px solid #1e1e38;
        font-size: 0.9rem;
      }
      .item-linha:last-child {
        border-bottom: none;
      }
      .item-qtd {
        background: var(--laranja);
        color: #fff;
        font-weight: 900;
        font-size: 0.75rem;
        padding: 2px 7px;
        border-radius: 20px;
        flex-shrink: 0;
      }
      .item-detalhes {
        flex: 1;
      }
      .item-nome {
        font-weight: 700;
      }
      .item-extra {
        font-size: 0.78rem;
        color: #7ec8a4;
        margin-top: 2px;
      }
      .item-obs {
        font-size: 0.78rem;
        color: #f6a623;
        margin-top: 2px;
        font-weight: 700;
      }
      .item-preco {
        font-weight: 700;
        color: var(--laranja);
        flex-shrink: 0;
      }

      .total-linha {
        display: flex;
        justify-content: space-between;
        padding: 12px 0 0;
        font-weight: 900;
        font-size: 1.05rem;
        border-top: 2px solid #2a2a4a;
        margin-top: 4px;
      }
      .total-linha span:last-child {
        color: var(--laranja);
      }

      /* INFO LINHA */
      .info-grid {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .info-row {
        display: flex;
        gap: 10px;
        font-size: 0.88rem;
      }
      .info-label {
        color: var(--muted);
        min-width: 80px;
        font-weight: 600;
      }
      .info-val {
        font-weight: 700;
      }

      /* LOADER */
      .loader {
        text-align: center;
        padding: 60px 20px;
        color: var(--muted);
      }
      .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #333;
        border-top-color: var(--laranja);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ERRO */
      .erro-box {
        text-align: center;
        padding: 40px 20px;
        color: var(--muted);
      }
      .erro-box .emoji {
        font-size: 3rem;
        display: block;
        margin-bottom: 12px;
      }
      .erro-box h2 {
        color: var(--red);
        margin-bottom: 8px;
      }

      /* BADGE ao vivo */
      .ao-vivo {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(16, 185, 129, 0.12);
        color: var(--green);
        font-size: 0.75rem;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 20px;
        margin-bottom: 20px;
      }
      .ao-vivo .dot {
        width: 7px;
        height: 7px;
        background: var(--green);
        border-radius: 50%;
        animation: blink 1.2s infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">🍕 Pizzaria <span>RA</span></div>
      <div class="sub">Acompanhamento de Pedido</div>
    </header>

    <div id="app">
      <div class="loader">
        <div class="spinner"></div>
        <div>Buscando seu pedido...</div>
      </div>
    </div>

    <script type="module">
      import {
        initializeApp,
        getApps,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getFirestore,
        doc,
        onSnapshot,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBm9XjET1VETadadyq9MOSij1f4ND_4SI4",
        authDomain: "pizzaria-rael.firebaseapp.com",
        projectId: "pizzaria-rael",
        storageBucket: "pizzaria-rael.firebasestorage.app",
        messagingSenderId: "737517289116",
        appId: "1:737517289116:web:1a49ac56da1b21e25b3759",
      };

      // Evitar dupla inicialização
      const app = getApps().length
        ? getApps()[0]
        : initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // ── helpers ──────────────────────────────────────────────────────────────────
      const appEl = document.getElementById("app");

      function fmtDate(ts) {
        if (!ts) return "";
        const d = ts.toDate ? ts.toDate() : new Date(ts);
        return d.toLocaleString("pt-BR");
      }
      function fmtMoeda(v) {
        return (
          "R$ " +
          Number(v || 0)
            .toFixed(2)
            .replace(".", ",")
        );
      }

      // ── configurações de status ───────────────────────────────────────────────────
      const STATUS_CFG = {
        Pendente: {
          cor: "#f59e0b",
          bg: "rgba(245,158,11,.15)",
          emoji: "⏳",
          label: "Aguardando confirmação",
        },
        Preparando: {
          cor: "#3b82f6",
          bg: "rgba(59,130,246,.15)",
          emoji: "👨‍🍳",
          label: "Na cozinha agora!",
        },
        "Saiu para entrega": {
          cor: "#8b5cf6",
          bg: "rgba(139,92,246,.15)",
          emoji: "🛵",
          label: "A caminho de você!",
        },
        Entregue: {
          cor: "#10b981",
          bg: "rgba(16,185,129,.15)",
          emoji: "✅",
          label: "Entregue com sucesso!",
        },
        Cancelado: {
          cor: "#ef4444",
          bg: "rgba(239,68,68,.15)",
          emoji: "❌",
          label: "Pedido cancelado",
        },
      };

      const STEPS = [
        {
          key: "Pendente",
          emoji: "📝",
          title: "Pedido recebido",
          desc: "Sua mensagem chegou!",
        },
        {
          key: "Preparando",
          emoji: "👨‍🍳",
          title: "Em preparação",
          desc: "A cozinha está caprichando!",
        },
        {
          key: "Saiu para entrega",
          emoji: "🛵",
          title: "Saiu para entrega",
          desc: "Já está a caminho!",
        },
        {
          key: "Entregue",
          emoji: "✅",
          title: "Entregue",
          desc: "Bom apetite! 🍕",
        },
      ];

      function stepIndex(status) {
        return STEPS.findIndex((s) => s.key === status);
      }

      let _lastStatus = null;

      function renderPage(data, id) {
        const status = data.status || "Pendente";
        const cfg = STATUS_CFG[status] || STATUS_CFG["Pendente"];
        const isCancelado = status === "Cancelado";
        const curIdx = stepIndex(status);

        const numPedido = "#" + String(id).slice(-4).toUpperCase();

        // ── itens ──────────────────────────────────────────────────────────────────
        const itens = data.itens || data.items || data.cartSnapshot || [];
        let itensHTML = "";
        itens.forEach((item) => {
          const nome = item.name || item.nome || "—";
          const qtd = item.quantity || item.quantidade || 1;
          const preco = item.price || item.preco || 0;
          const extras = item.extras || [];
          const obs = (item.obs || "").trim();
          const metade = item.secondFlavor || item.metade || "";
          const tamanho = item.pizzaSize || item.tamanho || "";
          const tamLabels = { P: "Pequena", M: "Média", G: "Grande" };

          let detalhesHTML = `<div class="item-nome">${nome}</div>`;
          if (tamanho)
            detalhesHTML += `<div class="item-extra">📏 ${tamLabels[tamanho] || tamanho}</div>`;
          if (metade)
            detalhesHTML += `<div class="item-extra">🍕 Metade: ${metade}</div>`;
          extras.forEach((e) => {
            const el = typeof e === "object" ? e.label : e;
            detalhesHTML += `<div class="item-extra">➕ ${el}</div>`;
          });
          if (obs) detalhesHTML += `<div class="item-obs">⚠️ ${obs}</div>`;

          const subtotal = (preco + (item.extrasTotal || 0)) * qtd;
          itensHTML += `
      <div class="item-linha">
        <span class="item-qtd">${qtd}×</span>
        <div class="item-detalhes">${detalhesHTML}</div>
        <span class="item-preco">${fmtMoeda(subtotal)}</span>
      </div>`;
        });

        // ── stepper ────────────────────────────────────────────────────────────────
        let stepperHTML = "";
        if (isCancelado) {
          stepperHTML = `
      <div class="step cancelled">
        <div class="step-icon">❌</div>
        <div class="step-info">
          <div class="step-title">Pedido Cancelado</div>
          <div class="step-desc">Entre em contato conosco para mais informações.</div>
        </div>
      </div>`;
        } else {
          STEPS.forEach((step, idx) => {
            const isDone = idx < curIdx;
            const isActive = idx === curIdx;
            const cls = isDone ? "done" : isActive ? "active" : "";
            stepperHTML += `
        ${idx > 0 ? `<div class="step-connector ${isDone ? "done" : ""}"></div>` : ""}
        <div class="step ${cls}">
          <div class="step-icon">${step.emoji}</div>
          <div class="step-info">
            <div class="step-title">${step.title}</div>
            <div class="step-desc">${step.desc}</div>
          </div>
        </div>`;
          });
        }

        // ── tipo de entrega / pgto ─────────────────────────────────────────────────
        const tipoLabel =
          data.tipoPedido === "delivery" ? "🛵 Delivery" : "🏪 Retirada";
        const pagLabels = {
          pix: "PIX",
          cartao: "Cartão",
          dinheiro: "Dinheiro",
        };
        const pagLabel =
          pagLabels[data.pagamento] || (data.pagamento || "").toUpperCase();

        let enderecoRow = "";
        if (data.tipoPedido === "delivery" && data.endereco) {
          enderecoRow = `<div class="info-row"><span class="info-label">📍 Endereço</span><span class="info-val">${data.endereco}</span></div>`;
        }

        // Última atualização
        const agora = new Date().toLocaleTimeString("pt-BR");

        // ── HTML final ─────────────────────────────────────────────────────────────
        appEl.innerHTML = `
    <div class="card">
      <div class="ao-vivo"><span class="dot"></span> Atualização em tempo real · ${agora}</div>

      <div class="pedido-num">
        <div class="label">Pedido</div>
        <div class="num">${numPedido}</div>
        <div class="data">${fmtDate(data.dataPedido)}</div>
      </div>

      <div class="status-atual" style="background:${cfg.bg}; color:${cfg.cor};">
        <span class="emoji">${cfg.emoji}</span>
        <span>${cfg.label}</span>
      </div>

      <div class="stepper">${stepperHTML}</div>
    </div>

    <div class="card">
      <div class="resumo-titulo">📋 Resumo do Pedido</div>
      ${itensHTML}
      <div class="total-linha">
        <span>Total</span>
        <span>${fmtMoeda(data.total)}</span>
      </div>
    </div>

    <div class="card">
      <div class="resumo-titulo">ℹ️ Informações</div>
      <div class="info-grid">
        <div class="info-row">
          <span class="info-label">👤 Cliente</span>
          <span class="info-val">${data.clienteNome || "—"}</span>
        </div>
        <div class="info-row">
          <span class="info-label">📱 Telefone</span>
          <span class="info-val">${data.telefone || "—"}</span>
        </div>
        <div class="info-row">
          <span class="info-label">🚀 Entrega</span>
          <span class="info-val">${tipoLabel}</span>
        </div>
        ${enderecoRow}
        <div class="info-row">
          <span class="info-label">💳 Pagamento</span>
          <span class="info-val">${pagLabel}</span>
        </div>
      </div>
    </div>`;
      }

      // ── buscar ID da URL e escutar Firestore ──────────────────────────────────────
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get("id");

      if (!orderId) {
        appEl.innerHTML = `<div class="card erro-box">
    <span class="emoji">😕</span>
    <h2>Link inválido</h2>
    <p>Este link não contém um ID de pedido válido.</p>
  </div>`;
      } else {
        let unsubscribe = null;

        function startListener() {
          if (unsubscribe) unsubscribe();

          const docRef = doc(db, "pedidos", orderId);
          unsubscribe = onSnapshot(
            docRef,
            { includeMetadataChanges: false },
            (snap) => {
              if (!snap.exists()) {
                appEl.innerHTML = `<div class="card erro-box">
            <span class="emoji">🔍</span>
            <h2>Pedido não encontrado</h2>
            <p>Verifique se o link está correto.</p>
          </div>`;
              } else {
                renderPage(snap.data(), snap.id);
              }
            },
            (err) => {
              console.error("[acompanhar] Erro no listener:", err);
              // Tentar reconectar após 5 segundos
              setTimeout(startListener, 5000);
              appEl.innerHTML = `<div class="card erro-box">
          <span class="emoji">⚠️</span>
          <h2>Erro de conexão</h2>
          <p>Reconectando em 5 segundos...</p>
        </div>`;
            },
          );
        }

        // Iniciar listener
        startListener();

        // Reconectar ao voltar para a aba (visibilidade)
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") {
            startListener();
          }
        });
      }
    </script>
  </body>
</html>
