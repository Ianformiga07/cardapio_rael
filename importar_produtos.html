  // ── LÓGICA DE IMPORTAÇÃO ────────────────────────────────────────────────────
  window.iniciarImportacao = async function () {
    const btn = document.getElementById("btn");
    const logEl = document.getElementById("log");
    const resumoEl = document.getElementById("resumo");

    btn.disabled = true;
    btn.textContent = "⏳ Importando...";
    logEl.innerHTML = "";
    resumoEl.style.display = "none";

    function log(msg, tipo = "inf") {
      const line = document.createElement("div");
      line.className = tipo;
      line.textContent = msg;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    log("🔍 Verificando produtos já cadastrados...");

    // Buscar nomes já existentes para evitar duplicatas
    const snap = await getDocs(collection(db, "produtos"));
    const nomesExistentes = new Set(snap.docs.map(d => d.data().nome));
    log(`ℹ️  ${nomesExistentes.size} produto(s) já existem no banco.`);

    let adicionados = 0;
    let pulados = 0;
    let erros = 0;

    for (const p of PRODUTOS) {
      if (nomesExistentes.has(p.nome)) {
        log(`⏭  Pulado (já existe): ${p.nome}`, "inf");
        pulados++;
        continue;
      }

      try {
        await addDoc(collection(db, "produtos"), {
          nome: p.nome,
          descricao: p.descricao,
          preco: p.preco,
          categoria: p.categoria,
          imagem: p.imagem,
          badge: p.badge || "",
          precos: p.precos || null,
          estoque: 99,
          esgotado: false,
          ativo: true,
          criadoEm: serverTimestamp(),
        });
        log(`✅ Adicionado: ${p.nome}`, "ok");
        adicionados++;
      } catch (err) {
        log(`❌ Erro ao adicionar "${p.nome}": ${err.message}`, "err");
        erros++;
      }
    }

    log("─────────────────────────────");
    log(`🏁 Concluído! ✅ ${adicionados} adicionados | ⏭ ${pulados} pulados | ❌ ${erros} erros`, adicionados > 0 ? "ok" : "inf");

    resumoEl.textContent = `✅ ${adicionados} produtos importados com sucesso! Você já pode fechar esta página.`;
    resumoEl.style.display = "block";
    btn.textContent = "✔ Importação Concluída";
  };
